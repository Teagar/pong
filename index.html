<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>Pong</title>
  <style>
    body {
      background: lightblue;
    }
    canvas {
      background: black;
      border: 4px solid white;
    }

  </style>
  </head>

  <body>
    <h1>Pong</h1>
    <p>Jogador 1: W e S / Jogador 2: cima e baixo</p>

    <canvas id="jogo" width="600" height="400"></canvas>

    <script>
      const tela = document.getElementById("jogo");
      const pincel = tela.getContext("2d");

      const raquete1 = { x: 20, y: 150 };
      const raquete2 = { x: 565, y: 150 };

      const bola = {x: 300, y: 200, velX: 4, velY: 4};

      const larguraRaquete = 15;
      const alturaRaquete = 100;
      const tamanhoBola = 15;

      const teclas = {};

      document.addEventListener("keydown", evento => {
        teclas[evento.key] = true;
      })

      document.addEventListener("keyup", evento => {
        teclas[evento.key] = false;
      })

      function moverRaquetes() {
        if (teclas["w"]) raquete1.y -= 5;
        if (teclas["s"]) raquete1.y += 5;


        if (teclas["ArrowUp"]) raquete2.y -= 5;
        if (teclas["ArrowDown"]) raquete2.y += 5;

        if (raquete1.y < 0) raquete1.y = 0;

        if (raquete1.y > tela.height - alturaRaquete) {
          raquete1.y = tela.height - alturaRaquete;
        }


        if (raquete2.y < 0) raquete2.y = 0;

        if (raquete2.y > tela.height - alturaRaquete) {
          raquete2.y = tela.height - alturaRaquete;
        }

        if (tocou(raquete1) || tocou(raquete2)) {
          bola.velX = -bola.velX;
        }
      }

      function tocou(raquete) {
        return (
          bola.x < raquete.x + larguraRaquete &&
          bola.x + tamanhoBola > raquete.x &&
          bola.y < raquete.y + alturaRaquete &&
          bola.y + tamanhoBola > raquete.y
        );
      }

      function desenhar() {
        pincel.clearRect(0, 0, tela.width, tela.height)
        pincel.fillStyle = "white";

        pincel.fillRect(
          raquete1.x,
          raquete1.y,
          larguraRaquete,
          alturaRaquete
        );

        pincel.fillRect(
          raquete2.x,
          raquete2.y,
          larguraRaquete,
          alturaRaquete
        );

        pincel.fillStyle = "yellow";

        pincel.fillRect(
          bola.x,
          bola.y,
          tamanhoBola,
          tamanhoBola
        );
      }

      function moverBola() {
        bola.x += bola.velX;
        bola.y += bola.velY;
        
        if (bola.y <= 0 || bola.y + tamanhoBola >= tela.height) {
         bola.velY = -bola.velY; 
        }

        if (bola.x < 0 || bola.x > tela.width) {
          bola.x = tela.width / 2;
          bola.y = tela.width / 2;
          bola.velX = -bola.velX;
        }

      }
      
      function jogar() {
        moverRaquetes();
        moverBola();
        desenhar();

        requestAnimationFrame(jogar);
      }

      jogar();

    </script>
  </body>

</html>
